# Configuração do copiloto. Ajuste aqui antes de rodar.

hotkey: "<ctrl>+<space>"   # segure para gravar, solte para transcrever e enviar

audio:
  sample_rate: 16000
  device: null              # null = dispositivo de entrada padrão do sistema

stt:
  model: "small"            # tiny | base | small | medium | large-v3
  device: "cpu"              # cpu | cuda (se tiver GPU disponível)
  compute_type: "int8"       # int8 é o mais leve para CPU
  language: "pt"

llm:
  provider: "anthropic"      # "anthropic" (API paga) ou "ollama" (local, grátis)
  model: "claude-sonnet-4-5" # usado quando provider = anthropic
  max_tokens: 1024
  max_tool_turns: 6          # limite de idas e vindas de tool-use por comando
  ollama:                    # usado quando provider = ollama
    model: "qwen2.5:7b"      # precisa suportar tool-calling (qwen2.5, llama3.1...)
    host: "http://localhost:11434"
    timeout: 300             # modelos locais podem ser lentos; segundos

mcp_servers:
  blender:
    command: "uvx"
    args: ["blender-mcp"]
    tool_prefix: "blender_"
  freecad:
    command: "uvx"
    args: ["freecad-mcp"]
    tool_prefix: "freecad_"

persona:
  system_prompt_file: "persona.md"

feedback:
  voice: false                # ative depois se quiser TTS
